# Railway config-as-code (https://docs.railway.com/reference/config-as-code).
# The service is built from the Dockerfile and must answer GET /health.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# One replica on purpose: Telegram webhook + a single SQLite file must not be
# processed by two instances at once. Scale out only after moving to Postgres.
numReplicas = 1
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
